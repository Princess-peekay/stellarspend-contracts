[package]
name = "fee"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Gate the integration tests (which expect the full fee-contract implementation)
# behind this feature so that `cargo test --workspace` does not fail while the
# implementation is a work-in-progress.  Run them once the contract is complete:
#   cargo test -p fee --features fee-impl
fee-impl = []

[dependencies]
soroban-sdk = { workspace = true }
shared = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[[test]]
name = "batching"
path = "tests/batching.rs"
required-features = ["fee-impl"]

[[test]]
name = "batch_preview"
path = "tests/batch_preview.rs"
required-features = ["fee-impl"]

[[test]]
name = "decay"
path = "tests/decay.rs"
required-features = ["fee-impl"]

[[test]]
name = "escrow"
path = "tests/escrow.rs"
required-features = ["fee-impl"]

[[test]]
name = "get_fee_config"
path = "tests/get_fee_config.rs"
required-features = ["fee-impl"]

[[test]]
name = "lock"
path = "tests/lock.rs"
required-features = ["fee-impl"]

[[test]]
name = "min_fee"
path = "tests/min_fee.rs"
required-features = ["fee-impl"]

[[test]]
name = "reconciliation"
path = "tests/reconciliation.rs"
required-features = ["fee-impl"]

[[test]]
name = "rollover"
path = "tests/rollover.rs"
required-features = ["fee-impl"]

[[test]]
name = "validation"
path = "tests/validation.rs"
required-features = ["fee-impl"]
