[workspace]
members = [
  "contracts/spending-policy",
  "contracts/spending-limits",
  "contracts/spending-categories",
  "contracts/spending-rules",
  "contracts/budget",
  "contracts/budget-allocation",
  "contracts/savings",
  "contracts/savings-goals",
  "contracts/escrow",
  "contracts/multi-currency-wallet",
  "contracts/currency-conversion",
  "contracts/transactions",
  "contracts/recurring-payment",
  "contracts/batch-payment",
  "contracts/batch-transfer",
  "contracts/rewards",
  "contracts/batch-rewards",
  "contracts/token",
  "contracts/treasury",
  "contracts/fee",
  "contracts/governance",
  "contracts/delegation",
  "contracts/escrow-v2",
  "contracts/subscription",
  "contracts/timelock",
  "contracts/multisig",
  "contracts/access-control",
  "contracts/audit",
  "contracts/shared",
  "contracts/pausable",
  "contracts/compliance",
  "contracts/merchant-tagging",
  "contracts/notification",
  "contracts/cross-contract",
  "contracts/activity-feed",
  "contracts/zk-verifier",
  "contracts/refunds",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/stellarspend/stellarspend-contracts"

[workspace.dependencies]
soroban-sdk = "=22.0.0"
shared = { path = "contracts/shared" }
ed25519-dalek = "=2.2.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
